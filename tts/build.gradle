plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.hilt.android)
    alias(libs.plugins.ksp)
}

apply plugin: 'com.huawei.agconnect'

android {
    namespace 'com.hoshiengineering.tts'
    compileSdk 36

    defaultConfig {
        minSdk 24

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation project(path: ':core')
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core

    // Hilt (inyección de dependencias)
    implementation libs.hilt.android
    ksp libs.hilt.compiler

   // ksp(libs.javapoet)
    //ksp libs.room.compiler
   // implementation libs.ml.computer.voice.tts.model
    implementation libs.ml.computer.voice.tts.model.bee
    implementation libs.ml.computer.voice.tts.model.eagle
    implementation libs.ml.computer.vision.ocr
    implementation libs.ml.computer.vision.ocr.latin.model
    implementation libs.ml.computer.vision.ocr.jk.model
    implementation libs.ml.computer.vision.ocr.cn.model
    implementation libs.ml.computer.vision.cloud
}